version: '3.8'
services:
    web:
        build:
            context: .
            dockerfile: ./docker/web/Dockerfile
        ports:
            - ${APP_PORT}:${APP_PORT}
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        networks:
            - web
        volumes:
            - ${STRAVA_ACTIVITIES_CACHE_FOLDER}:/usr/src/app/.cache
            - ./.env.generated:/usr/src/app/.env.generated
        environment:
            - DATABASE_URL=${DATABASE_URL_DOCKER}
            - HUSKY=0
            - APP_PORT=${APP_PORT}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:' + process.env.APP_PORT + '/healthcheck/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
    db:
        image: percona:8.0
        command: ['--default_authentication_plugin=caching_sha2_password']
        platform: linux/amd64
        cap_add:
            - SYS_NICE
        restart: unless-stopped
        environment:
            - MYSQL_USER=${DB_USER}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
        ports:
            - ${DB_PORT_EXT}:${DB_PORT_INT}
        volumes:
            - ${MYSQL_DATA_FOLDER}:/var/lib/mysql
            - ./docker/db/:/docker-entrypoint-initdb.d/
        networks:
            - web
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
    grafana:
        build:
            context: .
            dockerfile: ./grafana/Dockerfile
        restart: always
        environment:
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_DATABASE=${DB_DATABASE}
            - DB_PORT_INT=${DB_PORT_INT}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
        ports:
            - ${GRAFANA_EXTERNAL_PORT}:3000
        volumes:
            - ${GRAFANA_DATA_FOLDER}:/var/lib/grafana
        networks:
            - web
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
    prisma-studio:
        restart: unless-stopped
        image: node:22.13.0
        working_dir: /usr/src/app
        volumes:
            - .:/usr/src/app
        command: ['npx', 'prisma', 'studio']
        environment:
            - DATABASE_URL=${DATABASE_URL_DOCKER}
        ports:
            - '3671:5555'
        networks:
            - web
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:5555/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
networks:
    web:
